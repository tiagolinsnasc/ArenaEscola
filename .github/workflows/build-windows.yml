name: Build Windows

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v6

      - name: Configurar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verificar Java
        run: java -version

      - name: Verificar Maven
        run: mvn -version

      - name: Compilar projeto
        run: mvn clean package

      - name: Copiar dependências
        run: |
          mvn dependency:copy-dependencies `
            -DoutputDirectory=target/lib `
            -DincludeScope=runtime

      - name: Criar aplicativo com jpackage
        run: |
          mkdir target\app

          copy target\jogos-internos.jar target\app\

          jpackage `
            --type app-image `
            --name "Jogos Internos" `
            --app-version 1.0.0 `
            --input target\app `
            --main-jar jogos-internos.jar `
            --main-class br.com.suaescola.jogosinternos.Launcher `
            --dest target\package

      - name: Compactar aplicativo
        run: |
          Compress-Archive `
            -Path "target\package\Jogos Internos" `
            -DestinationPath "target\Jogos-Internos-Windows.zip"

      - name: Disponibilizar aplicativo
        uses: actions/upload-artifact@v5
        with:
          name: Jogos-Internos-Windows
          path: target/Jogos-Internos-Windows.zip
